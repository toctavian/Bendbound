services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    environment:
      ROUTING_HOSTNAME: ${ROUTING_HOSTNAME:?Set your routing DNS hostname}
      ROUTING_API_TOKEN: ${ROUTING_API_TOKEN:?Set a random pilot access token}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.data/caddy/data:/data
      - ./.data/caddy/config:/config
    depends_on: [api]
    restart: unless-stopped
    mem_limit: 128m
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
